<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koala Laundry Tracker</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <img src="logo.png" class="logo" alt="Koala Laundry">

    <h1>Track Your Laundry</h1>

    <p class="subtitle">
        Enter your tracking code to view your laundry status.
    </p>

    <div class="search-box">

        <input
            type="text"
            id="trackingCode"
            placeholder="Enter Tracking Code">

        <button onclick="trackLaundry()">
            Track Laundry
        </button>

    </div>

    <div id="result" class="result">

    </div>

</div>

<script>

      form.addEventListener('submit', function(e) {
            e.preventDefault();
            trackLaundry();
        });



async function trackLaundry(){

        const code = document
        .getElementById("trackingCode")
        .value
        .trim();

    if (code === "") {
        alert("Please enter your tracking code.");
        return;
    }

    window.location.href =
        "results.html?code=" +
        encodeURIComponent(code);

}

</script>

</body>
</html>
