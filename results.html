<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Koala Laundry Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:#f5f7fb;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    color:#2f3b52;

}

.container{

    width:90%;

    max-width:750px;

}

.card{

    background:#fff;

    border-radius:20px;

    padding:40px;

    box-shadow:0 15px 35px rgba(0,0,0,.08);

}

.logo{

    text-align:center;

    font-size:30px;

    font-weight:600;

    margin-bottom:10px;

}

.subtitle{

    text-align:center;

    color:#777;

    margin-bottom:35px;

}

.status{

    text-align:center;

    font-size:32px;

    font-weight:bold;

    margin-bottom:30px;

}

.progress{

    display:flex;

    justify-content:space-between;

    margin:35px 0;

    position:relative;

}

.progress::before{

    content:"";

    position:absolute;

    top:20px;

    left:0;

    right:0;

    height:4px;

    background:#ddd;

    z-index:0;

}

.step{

    position:relative;

    z-index:2;

    text-align:center;

    flex:1;

}

.circle{

    width:40px;

    height:40px;

    border-radius:50%;

    background:#ccc;

    color:white;

    display:flex;

    justify-content:center;

    align-items:center;

    margin:auto;

    font-weight:bold;

}

.completed .circle{

    background:#4CAF50;

}

.current .circle{

    background:#ff9800;

}

.label{

    margin-top:10px;

    font-size:14px;

}

table{

    width:100%;

    border-collapse:collapse;

    margin-top:25px;

}

td{

    padding:15px;

    border-bottom:1px solid #ececec;

}

td:first-child{

    font-weight:600;

    width:220px;

}

button{

    margin-top:35px;

    width:100%;

    padding:18px;

    border:none;

    border-radius:50px;

    background:#4CAF50;

    color:white;

    font-size:16px;

    cursor:pointer;

}

button:hover{

    background:#429845;

}

.error{

    text-align:center;

    color:#d32f2f;

    font-size:22px;

    padding:50px;

}

.loading{

    text-align:center;

    font-size:22px;

    padding:50px;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
KOALA LAUNDRY
</div>

<div class="subtitle">
Laundry Tracking System
</div>

<div id="content">

<div class="loading">
Looking up your laundry...
</div>

</div>

</div>

</div>

<script>

const scriptURL =
"https://script.google.com/macros/s/AKfycby4VsR76xlHLwHz6Q6J47ExCrvHaqApeRlNTNI9QLrAUyyNppzgt2wV76XkeW3vLzBv/exec";

const params =
new URLSearchParams(window.location.search);

const trackingCode =
params.get("code");

if(trackingCode==null){

    window.location.href="index.html";

}

loadLaundry(trackingCode);

async function loadLaundry(code){

    try{

        const response =
        await fetch(
        scriptURL +
        "https://script.google.com/macros/s/AKfycby4VsR76xlHLwHz6Q6J47ExCrvHaqApeRlNTNI9QLrAUyyNppzgt2wV76XkeW3vLzBv/exec?code=" +
        encodeURIComponent(code));

        const data =
        await response.json();

        if(data.found){

            displayLaundry(data);

        }else{

            showNotFound();

        }

    }catch(err){

        console.log(err);

        document.getElementById("content").innerHTML=`

        <div class="error">

        Unable to connect to server.

        </div>

        `;

    }

}

function displayLaundry(data){

    const stage = getStage(data.status);

    document.getElementById("content").innerHTML=`

<div class="status">

${data.status}

</div>

<div class="progress">

${step(stage>=1,stage==1,"1","Received")}

${step(stage>=2,stage==2,"2","Washing")}

${step(stage>=3,stage==3,"3","Drying")}

${step(stage>=4,stage==4,"4","Folding")}

${step(stage>=5,stage==5,"5","Ready")}

</div>

<table>

<tr>

<td>Tracking Code</td>

<td>${data.trackingCode}</td>

</tr>

<tr>

<td>Customer</td>

<td>${data.customer}</td>

</tr>

<tr>

<td>Service</td>

<td>${data.service}</td>

</tr>

<tr>

<td>Estimated Completion</td>

<td>${data.eta}</td>

</tr>

<tr>

<td>Last Updated</td>

<td>${data.updated}</td>

</tr>

</table>

<button onclick="window.location='index.html'">

Track Another Laundry

</button>

`;

}

function step(done,current,number,label){

    let cls="";

    if(done){

        cls="completed";

    }

    if(current){

        cls="current";

    }

    return`

<div class="step ${cls}">

<div class="circle">

${number}

</div>

<div class="label">

${label}

</div>

</div>

`;

}

function getStage(status){

    switch(status.toLowerCase()){

        case "received":
            return 1;

        case "washing":
            return 2;

        case "drying":
            return 3;

        case "folding":
            return 4;

        case "ready":
        case "ready for pickup":
            return 5;

        default:
            return 1;

    }

}

function showNotFound(){

document.getElementById("content").innerHTML=`

<div class="error">

Tracking Code Not Found

<br><br>

Please check your receipt and try again.

<br><br>

<button onclick="window.location='index.html'">

Search Again

</button>

</div>

`;

}

</script>

</body>
</html>
