<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koala Laundry Tracker</title>
  <meta name="description" content="Track your laundry status with Koala Laundry Tracker." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root{
      --bg:#f5f7fb;
      --card:#fff;
      --text:#2f3b52;
      --muted:#777;
      --accent:#4CAF50;
      --accent-hover:#429845;
      --warn:#ff9800;
      --error:#d32f2f;
      --line:#ececec;
      font-size:16px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:'Poppins',sans-serif;
      background:var(--bg);
      color:var(--text);
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:1rem;
    }

    .container{width:100%;max-width:820px}
    .card{
      background:var(--card);
      border-radius:16px;
      padding:28px;
      box-shadow:0 10px 30px rgba(0,0,0,.06);
    }

    header.logo{
      text-align:center;
      margin-bottom:6px;
    }

    header .brand{font-size:1.25rem;font-weight:600}
    header .subtitle{color:var(--muted);text-align:center;margin-bottom:22px}

    .status{
      text-align:center;
      font-size:1.4rem;
      font-weight:700;
      margin-bottom:1rem;
    }

    .progress{
      display:flex;
      gap:12px;
      justify-content:space-between;
      margin:22px 0;
      position:relative;
      align-items:center;
    }

    .progress::before{
      content:"";
      position:absolute;
      top:22px;
      left:0;
      right:0;
      height:4px;
      background:#ddd;
      z-index:0;
      border-radius:2px;
    }

    .step{position:relative;z-index:2;text-align:center;flex:1;min-width:64px}
    .circle{
      width:40px;height:40px;border-radius:50%;background:#ccc;color:white;display:flex;align-items:center;justify-content:center;margin:auto;font-weight:700;
    }
    .step.completed .circle{background:var(--accent)}
    .step.current .circle{background:var(--warn)}
    .label{margin-top:8px;font-size:.875rem;color:var(--muted)}

    table{width:100%;border-collapse:collapse;margin-top:18px}
    th,td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left}
    th{width:220px;font-weight:600;color:var(--text);vertical-align:top}
    td{vertical-align:top}

    .controls{margin-top:20px;display:flex;gap:12px}
    button{
      padding:12px 16px;border:none;border-radius:999px;background:var(--accent);color:white;font-size:1rem;cursor:pointer;
    }
    button[type="button"]:hover{background:var(--accent-hover)}
    button.secondary{background:#eee;color:var(--text)}
    button.secondary:focus{outline:3px solid rgba(0,0,0,.08)}

    .error, .loading{
      text-align:center;font-size:1.125rem;padding:30px;color:var(--error)
    }

    /* focus-visible */
    :focus{outline:none}
    :focus-visible{outline:3px solid rgba(66, 152, 69, .25);border-radius:6px}

    @media (max-width:520px){
      th{display:block;width:100%}
      td{display:block}
      .progress{gap:8px}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" role="region" aria-labelledby="pageTitle">
      <header class="logo">
        <div class="brand">KOALA LAUNDRY</div>
        <div class="subtitle">Laundry Tracking System</div>
      </header>

      <main id="content" aria-live="polite">
        <div class="loading" id="initialLoading">Looking up your laundry...</div>
      </main>

      <noscript>
        <div style="padding:16px;color:#333;background:#fff;border-radius:8px;margin-top:12px">
          JavaScript is required to track an order. Please enable JavaScript and reload.
        </div>
      </noscript>
    </div>
  </div>

  <script>
    // Config: put non-sensitive configuration here. If the endpoint requires a secret, do not keep it in the client.
    const scriptURL = document.currentScript.getAttribute('data-script-url')
      || "https://script.google.com/macros/s/AKfycby4VsR76xlHLwHz6Q6J47ExCrvHaqApeRlNTNI9QLrAUyyNppzgt2wV76XkeW3vLzBv/exec";

    // Helpers
    function qs(key) { return new URLSearchParams(window.location.search).get(key) }
    function el(tag, attrs = {}, children = []) {
      const node = document.createElement(tag);
      Object.entries(attrs).forEach(([k,v])=>{
        if(k === 'text') node.textContent = v;
        else if(k === 'html') node.innerHTML = v;
        else node.setAttribute(k,v);
      });
      (Array.isArray(children) ? children : [children]).forEach(c => { if(c) node.appendChild(c) });
      return node;
    }

    // Build a safe element for the main content (no innerHTML with server data)
    function renderLaundry(data){
      const container = document.createElement('div');

      // status
      const status = el('div', { class: 'status', text: data.status || 'Unknown' });

      // progress
      const stage = getStage(data.status || '');
      const progress = el('div', { class: 'progress' });

      const steps = [
        ['1','Received'],
        ['2','Washing'],
        ['3','Drying'],
        ['4','Folding'],
        ['5','Ready']
      ];

      steps.forEach((s, idx) => {
        const done = stage >= idx+1;
        const current = stage === idx+1;
        const stepEl = el('div', { class: 'step' + (done ? ' completed' : '') + (current ? ' current' : '') });
        stepEl.appendChild(el('div',{class:'circle', text:s[0]}));
        stepEl.appendChild(el('div',{class:'label', text:s[1]}));
        progress.appendChild(stepEl);
      });

      // table with safe text insertion
      const table = el('table');
      const tbody = document.createElement('tbody');

      function row(label, value){
        const tr = document.createElement('tr');
        const th = document.createElement('th'); th.textContent = label;
        const td = document.createElement('td'); td.textContent = value ?? '';
        tr.appendChild(th); tr.appendChild(td);
        return tr;
      }

      tbody.appendChild(row('Tracking Code', data.trackingCode));
      tbody.appendChild(row('Customer', data.customer));
      tbody.appendChild(row('Receipt Date', formatDate(data.receiptDate)));
      tbody.appendChild(row('Service', data.service));
      tbody.appendChild(row('Last Updated', formatDateTime(data.updated)));

      table.appendChild(tbody);

      // controls
      const controls = el('div',{class:'controls'});
      const trackAnother = el('button',{type:'button', text:'Track Another Laundry'});
      trackAnother.addEventListener('click', ()=> window.location='index.html');
      controls.appendChild(trackAnother);

      container.appendChild(status);
      container.appendChild(progress);
      container.appendChild(table);
      container.appendChild(controls);

      return container;
    }

    function renderNotFound(){
      const d = document.createElement('div');
      d.className = 'error';
      d.textContent = 'Tracking Code Not Found. Please check your receipt and try again.';
      const btn = el('div',{},[el('button',{type:'button', text:'Search Again'})]);
      btn.querySelector('button').addEventListener('click', ()=> window.location='index.html');
      const wrapper = el('div');
      wrapper.appendChild(d);
      wrapper.appendChild(btn);
      return wrapper;
    }

    function renderNetworkError(){
      const wrapper = document.createElement('div');
      wrapper.className = 'error';
      wrapper.textContent = 'Unable to connect to server. Please check your connection.';
      const retry = el('button',{type:'button', text:'Retry'});
      retry.addEventListener('click', ()=> { start(); });
      const back = el('button',{type:'button', text:'Back', class:'secondary'});
      back.addEventListener('click', ()=> window.location='index.html');
      const ctrl = el('div',{class:'controls'});
      ctrl.appendChild(retry);
      ctrl.appendChild(back);
      const container = el('div');
      container.appendChild(wrapper);
      container.appendChild(ctrl);
      return container;
    }

    function getStage(status){
      switch(String(status || '').toLowerCase()){
        case 'received': return 1;
        case 'washing': return 2;
        case 'drying': return 3;
        case 'folding': return 4;
        case 'ready':
        case 'ready for pickup': return 5;
        default: return 1;
      }
    }

    // Formatters
    function formatDate(iso){
      if(!iso) return '';
      try {
        const d = new Date(iso);
        return new Intl.DateTimeFormat(undefined, { year:'numeric', month:'short', day:'numeric' }).format(d);
      } catch(e){ return iso }
    }
    function formatDateTime(iso){
      if(!iso) return '';
      try {
        const d = new Date(iso);
        return new Intl.DateTimeFormat(undefined, { year:'numeric', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }).format(d);
      } catch(e){ return iso }
    }

    // Robust fetch with timeout and error handling
    async function fetchWithTimeout(url, timeout = 8000){
      const controller = new AbortController();
      const id = setTimeout(()=> controller.abort(), timeout);
      try{
        const res = await fetch(url, { signal: controller.signal, credentials: 'omit' });
        clearTimeout(id);
        return res;
      } catch(err){
        clearTimeout(id);
        throw err;
      }
    }

    // Load and render
    async function loadLaundry(code){
      const content = document.getElementById('content');
      content.innerHTML = '';
      content.appendChild(el('div',{class:'loading', text:'Looking up your laundry...'}));

      try{
        const url = scriptURL + encodeURIComponent(String(code || ''));
        const res = await fetchWithTimeout(url, 9000);

        if(!res.ok){
          // server returned 4xx/5xx
          console.error('Server error', res.status);
          content.innerHTML = '';
          content.appendChild(renderNetworkError());
          return;
        }

        // Try parse JSON with try/catch
        let data;
        try{
          data = await res.json();
        } catch(parseErr){
          console.error('Invalid JSON', parseErr);
          content.innerHTML = '';
          content.appendChild(renderNetworkError());
          return;
        }

        if(data && data.found){
          content.innerHTML = '';
          content.appendChild(renderLaundry(data));
        } else {
          content.innerHTML = '';
          content.appendChild(renderNotFound());
        }

      }catch(err){
        console.error('Fetch error', err);
        content.innerHTML = '';
        content.appendChild(renderNetworkError());
      }
    }

    // Kick off
    function start(){
      const trackingCode = qs('code');
      if(!trackingCode){
        // Instead of immediate redirect, show message and a link to index so user isn't bounced unexpectedly
        const content = document.getElementById('content');
        content.innerHTML = '';
        const msg = el('div',{class:'error', text:'No tracking code provided.'});
        const backBtn = el('button',{type:'button', text:'Go to tracking page'});
        backBtn.addEventListener('click', ()=> window.location='index.html');
        const container = el('div');
        container.appendChild(msg);
        container.appendChild(el('div',{class:'controls'}, [backBtn]));
        content.appendChild(container);
        return;
      }
      loadLaundry(trackingCode.trim());
    }

    // Run on load
    start();
  </script>
</body>
</html>
